name: Build APK

on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 not set; using a throwaway debug key (updates will not install over each other)"
          fi

      - name: Build release APK
        working-directory: launcher
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/glass-tv-home.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: glass-tv-home-apk
          path: glass-tv-home.apk

      - name: Publish GitHub release & update OTA metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" glass-tv-home.apk \
            --title "Glass TV Home ${tag}" \
            --notes "Built from ${GITHUB_SHA::7}. Install: adb install -r glass-tv-home.apk" \
            --latest

          VCODE=$(grep -E "versionCode\s+[0-9]+" launcher/app/build.gradle | awk '{print $2}')
          VNAME=$(grep -E "versionName\s+" launcher/app/build.gradle | sed -E "s/.*versionName\s+['\"]([^'\"]+)['\"].*/\1/")
          COMMIT_MSG=$(git log -1 --pretty=%s)
          DATE_STR=$(date -u +%Y-%m-%d)

          mkdir -p release
          cp glass-tv-home.apk release/glass-tv-home.apk

          # Keep release/README.md in step with the APK it describes.
          SIZE_KB=$(( $(stat -c %s glass-tv-home.apk) / 1024 ))
          SHA256=$(sha256sum glass-tv-home.apk | awk '{print $1}')
          sed -i -E "s|^\* \*\*Versi / Version\*\*: .*|* **Versi / Version**: \`v${VNAME}\` (Launcher Glass TV Home Edisi Indonesia: cuaca dan AQI, tempat, tetapan tema, OTA In-App Auto Update)|" release/README.md
          sed -i -E "s|^\* \*\*Saiz Fail\*\*: ~[0-9]+ KB|* **Saiz Fail**: ~${SIZE_KB} KB|" release/README.md
          sed -i -E "s|^\* \*\*SHA-256 Checksum\*\*: \`[0-9a-f]+\`|* **SHA-256 Checksum**: \`${SHA256}\`|" release/README.md

          cat > release/version.json <<EOF
          {
            "versionCode": ${VCODE:-11},
            "versionName": "${VNAME:-3.2.0-id}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/glass-tv-home.apk",
            "changelog": "${COMMIT_MSG}",
            "releaseDate": "${DATE_STR}"
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/version.json release/glass-tv-home.apk release/README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update OTA version.json to v${VNAME} (${VCODE})"
            git push origin main
          fi
